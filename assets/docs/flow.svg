<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="284" viewBox="0 0 1200 284" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de trabalho do Saraiva.AI</title>
<desc id="desc">Quatro etapas: conectar, acompanhar conversas, receber sugestões com IA e revisar antes de agir.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1915"/><stop offset="1" stop-color="#173128"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8FCF9A"/><stop offset="1" stop-color="#C6FF3E"/></linearGradient>
</defs>
<rect width="1200" height="284" rx="18" fill="url(#bg)"/>
<text x="38" y="43" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#F0FFF4">DA MENSAGEM À DECISÃO</text>
<text x="38" y="65" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A9C6B5">Um caminho de interface; recursos conectados dependem do backend configurado</text>
<path d="M266 158H314M562 158H610M858 158H906" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
<path d="m304 149 11 9-11 9M600 149l11 9-11 9M896 149l11 9-11 9" fill="none" stroke="#C6FF3E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="38" y="96" width="228" height="136" rx="17" fill="#244235" stroke="#4E8062"/>
<circle cx="70" cy="126" r="17" fill="#C6FF3E"/><text x="64" y="132" font-size="17" font-weight="700" fill="#153121">1</text>
<text x="59" y="167" font-size="20" font-weight="700" fill="#F3FFF7">Conectar</text><text x="59" y="190" font-size="13" fill="#BAD3C2">Configurar integração</text><text x="59" y="208" font-size="13" fill="#BAD3C2">e acompanhar o status</text>
<rect x="334" y="96" width="228" height="136" rx="17" fill="#244235" stroke="#4E8062"/>
<circle cx="366" cy="126" r="17" fill="#C6FF3E"/><text x="360" y="132" font-size="17" font-weight="700" fill="#153121">2</text>
<text x="355" y="167" font-size="20" font-weight="700" fill="#F3FFF7">Acompanhar</text><text x="355" y="190" font-size="13" fill="#BAD3C2">Ver conversas,</text><text x="355" y="208" font-size="13" fill="#BAD3C2">mensagens e prioridades</text>
<rect x="630" y="96" width="228" height="136" rx="17" fill="#244235" stroke="#4E8062"/>
<circle cx="662" cy="126" r="17" fill="#BEA4F9"/><text x="656" y="132" font-size="17" font-weight="700" fill="#153121">3</text>
<text x="651" y="167" font-size="20" font-weight="700" fill="#F3FFF7">Receber ideias</text><text x="651" y="190" font-size="13" fill="#BAD3C2">Sugestões com IA</text><text x="651" y="208" font-size="13" fill="#BAD3C2">e contexto da conversa</text>
<rect x="926" y="96" width="236" height="136" rx="17" fill="#244235" stroke="#4E8062"/>
<circle cx="958" cy="126" r="17" fill="#C6FF3E"/><text x="952" y="132" font-size="17" font-weight="700" fill="#153121">4</text>
<text x="947" y="167" font-size="20" font-weight="700" fill="#F3FFF7">Decidir e agir</text><text x="947" y="190" font-size="13" fill="#BAD3C2">Revisar, editar</text><text x="947" y="208" font-size="13" fill="#BAD3C2">e enviar quando quiser</text>
</g>
</svg>