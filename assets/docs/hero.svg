<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Saraiva.AI, inteligência para cada conversa</title>
<desc id="desc">Ilustração conceitual do aplicativo Saraiva.AI com conversas, sugestões de resposta e decisões.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071714"/><stop offset="1" stop-color="#132521"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C6FF3E"/><stop offset="1" stop-color="#57E49B"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19302A"/><stop offset="1" stop-color="#101F1C"/></linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#A3E7BE" stroke-opacity=".055"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".33"/></filter>
</defs>
<rect width="1200" height="490" rx="20" fill="url(#bg)"/>
<rect width="1200" height="490" rx="20" fill="url(#grid)"/>
<circle cx="1110" cy="28" r="255" fill="#86F7B7" fill-opacity=".045"/>
<circle cx="560" cy="480" r="260" fill="#A78BFA" fill-opacity=".035"/>
<rect x="56" y="52" width="11" height="24" rx="5.5" fill="url(#accent)"/>
<text x="85" y="71" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#F5FFF8" letter-spacing="2">SARAIVA.AI</text>
<text x="56" y="165" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700" fill="#F7FFF9">Converse com contexto.</text>
<text x="56" y="225" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700" fill="url(#accent)">Aja com clareza.</text>
<text x="58" y="280" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#C0D5CB">Conversas, sugestões e agentes em uma</text>
<text x="58" y="311" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#C0D5CB">experiência mobile feita para decisões melhores.</text>
<rect x="56" y="353" width="184" height="38" rx="19" fill="#C6FF3E"/>
<text x="77" y="378" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#0C1D16">REACT NATIVE + EXPO</text>
<rect x="253" y="353" width="130" height="38" rx="19" fill="#FFFFFF" fill-opacity=".08" stroke="#9FCBB2" stroke-opacity=".35"/>
<text x="273" y="378" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#D7ECE1">IA + WebSocket</text>
<text x="58" y="451" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#829C8E">Projeto de interface • Ilustração conceitual</text>
<g filter="url(#shadow)">
  <rect x="720" y="48" width="387" height="407" rx="26" fill="url(#panel)" stroke="#45745D" stroke-opacity=".75"/>
  <rect x="739" y="67" width="349" height="50" rx="14" fill="#244136"/>
  <circle cx="766" cy="92" r="15" fill="#C6FF3E"/>
  <path d="M760 92h12M766 86v12" stroke="#173021" stroke-width="2.4" stroke-linecap="round"/>
  <text x="793" y="89" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F3FFF6">Central de conversas</text>
  <text x="793" y="107" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A7C5B3">Leitura e contexto em um só lugar</text>
  <rect x="740" y="134" width="280" height="58" rx="14" fill="#FFFFFF" fill-opacity=".085"/>
  <text x="760" y="158" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#ECFFF3">Nova mensagem recebida</text>
  <text x="760" y="178" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#B0C8BB">“Podemos conversar amanhã?”</text>
  <rect x="802" y="209" width="285" height="67" rx="14" fill="#D4F8DF"/>
  <text x="821" y="232" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#15372B">Sugestão com contexto ✦</text>
  <text x="821" y="250" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#275143">“Claro! Qual horário funciona”</text>
  <text x="821" y="265" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#275143">melhor para você?”</text>
  <rect x="740" y="293" width="347" height="77" rx="15" fill="#1C352E" stroke="#466F5E"/>
  <circle cx="767" cy="321" r="13" fill="#AE90EF" fill-opacity=".2"/>
  <path d="m767 313 2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z" fill="#C8B8FF"/>
  <text x="789" y="318" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#F0FFF4">Você continua no controle</text>
  <text x="789" y="340" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ADC5B7">Revisar, editar ou enviar</text>
  <rect x="905" y="381" width="182" height="52" rx="15" fill="url(#accent)"/>
  <text x="946" y="412" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#10251A">Agir agora →</text>
</g>
</svg>